<!DOCTYPE html>
<html lang="zh-CN" data-theme="b">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>搜索触摸键盘 · 四位置方案草样（桌台模式）</title>
<style>
:root{
  --bg-page:#EEF2F7;--bg-surface:#F7F9FC;--bg-surface-2:#FFFFFF;--bg-elev:#E8EDF5;
  --border:#D3DAE6;--border-strong:#A8B4C6;
  --text:#16202E;--text-2:#4A5768;--text-3:#7C8899;
  --brand:#1A6DFF;--brand-ink:#0E4BC7;--done:#1FA463;--warn:#D0021B;
  --pad:20px;--gap:14px;--radius:14px;--top-h:78px;--pager-h:74px;
}
[data-theme="a"]{
  --bg-page:#0E1622;--bg-surface:#16202E;--bg-surface-2:#1E2937;--bg-elev:#22303F;
  --border:#2C3B4D;--border-strong:#41546B;
  --text:#E8EEF6;--text-2:#A9B7C8;--text-3:#7A8CA0;
  --brand:#4D9DFF;--brand-ink:#9AC6FF;--done:#3FBE7E;--warn:#FF6B6B;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  background:#8A93A0;font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  color:var(--text);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;
}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}

/* ---- demo 控件条：不属于原型，选完方案即删 ---- */
.ctl{
  flex:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 16px;background:#0B1220;color:#CFD8E6;font-size:13px;
}
.ctl b{color:#fff;font-size:14px;font-weight:600;margin-right:4px}
.ctl .sep{width:1px;height:22px;background:#33405A;margin:0 6px}
.ctl button{
  height:32px;padding:0 12px;border-radius:8px;background:#1C2740;border:1px solid #33405A;
  color:#CFD8E6;font-size:13px;
}
.ctl button.on{background:#2C6BF5;border-color:#2C6BF5;color:#fff;font-weight:600}
.ctl .note{color:#8E9DB4;font-size:12px}

/* ---- 屏幕等比框 ---- */
#shell{flex:1;min-height:0;padding:14px 16px 16px;display:flex}
#app{
  position:relative;flex:1;min-width:0;display:grid;
  grid-template-rows:auto minmax(0,1fr) auto auto;
  background:var(--bg-page);border-radius:10px;overflow:hidden;
}

/* ---------------- 顶栏 ---------------- */
.top{
  display:flex;align-items:center;gap:14px;height:var(--top-h);padding:0 var(--pad);
  background:var(--bg-surface);border-bottom:1px solid var(--border);overflow:hidden;
}
.brand b{display:block;font-size:21px;font-weight:800;white-space:nowrap}
.brand span{display:block;font-size:12px;color:var(--text-3);letter-spacing:.08em;margin-top:2px}
.vsep{width:1px;height:60%;background:var(--border);flex:none}
.tabs{display:flex;gap:4px;background:var(--bg-elev);padding:5px;border-radius:12px;flex:none}
.tabs button{height:44px;padding:0 16px;border-radius:9px;font-size:15px;font-weight:700;color:var(--text-2)}
.tabs button.on{background:var(--brand);color:#fff}
.chips{display:flex;gap:8px;flex:1 1 auto;min-width:0;overflow:hidden}
.chip{
  height:44px;padding:0 14px;border-radius:11px;background:var(--bg-surface-2);
  border:1px solid var(--border);display:inline-flex;align-items:center;gap:7px;flex:none;
  font-size:15px;font-weight:600;color:var(--text-2);
}
.chip.on{background:rgba(26,109,255,.14);border-color:var(--brand);color:var(--brand-ink)}
.top-sp{flex:1 1 0;min-width:8px}
.search{position:relative;flex:1 1 22vw;min-width:150px;max-width:22vw}
.search input{
  width:100%;height:46px;border-radius:11px;background:var(--bg-surface-2);
  border:1px solid var(--border);color:var(--text);outline:none;
  font-size:16px;padding-inline:38px 50px;text-overflow:ellipsis;
}
.search input::placeholder{color:var(--text-3);opacity:1}
.search.open input{border-color:var(--brand);box-shadow:0 0 0 3px rgba(61,139,255,.18)}
.search .ico{
  position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);
  font-size:16px;color:var(--text-3);pointer-events:none;
}
#kbBtn{
  position:absolute;inset-inline-end:5px;top:50%;transform:translateY(-50%);
  width:38px;height:38px;border-radius:9px;display:grid;place-items:center;
  background:var(--bg-elev);border:1px solid var(--border);font-size:15px;color:var(--text-2);
}
#kbBtn.on{background:var(--brand);border-color:var(--brand);color:#fff}
.who{display:flex;align-items:center;gap:9px;flex:none;font-size:15px;color:var(--text-2)}
.who .av{width:36px;height:36px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800}
.tb-btn{height:44px;padding:0 14px;border-radius:11px;background:var(--bg-surface-2);border:1px solid var(--border);font-size:15px;font-weight:600;color:var(--text-2);flex:none}
.clock{flex:none;text-align:end;font-size:22px;font-weight:800;line-height:1.05}
.clock small{display:block;font-size:11px;font-weight:600;color:var(--text-3);letter-spacing:.08em}

/* ---------------- 内容区 ---------------- */
.body{min-height:0;overflow:hidden;padding:var(--pad)}
.grid{
  width:100%;height:100%;display:grid;gap:var(--gap);
  grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));
}
.tcard{
  background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius);
  display:flex;flex-direction:column;overflow:hidden;opacity:1;transition:opacity .18s;
}
.tcard.dim{opacity:.28}
.tcard.hit{border-color:var(--brand);box-shadow:0 0 0 3px rgba(26,109,255,.3)}
.chd{flex:none;height:58px;display:flex;align-items:center;gap:10px;padding-inline:16px;border-bottom:1px solid var(--border)}
.ctno{
  display:inline-flex;align-items:center;height:38px;padding-inline:14px;border-radius:9px;
  background:var(--brand);color:#fff;font-weight:800;font-size:22px;letter-spacing:-.01em;
}
.ccnt{font-size:13px;font-weight:700;color:var(--text-2);white-space:nowrap}
.cbd{flex:1;min-height:0;padding:10px 12px;display:flex;flex-direction:column;gap:6px;justify-content:center;overflow:hidden}
.drow{
  display:flex;align-items:center;height:44px;border-radius:8px;padding-inline:12px;
  background:var(--bg-surface-2);border:1px solid var(--border);font-size:16px;gap:10px;
}
.drow em{margin-inline-start:auto;font-style:normal;color:var(--text-3);font-size:15px}

/* ---------------- 底栏 ---------------- */
.pager{
  display:flex;align-items:center;gap:16px;height:var(--pager-h);padding:0 var(--pad);
  background:var(--bg-surface);border-top:1px solid var(--border);
}
.pg-btn{height:46px;min-width:130px;padding:0 20px;border-radius:11px;background:var(--bg-surface-2);border:1.5px solid var(--border-strong);font-size:17px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.pg-mid{flex:1;display:flex;align-items:center;justify-content:center;gap:16px;font-size:14px;color:var(--text-2)}
#fab{width:52px;height:52px;border-radius:50%;background:var(--brand);color:#fff;font-size:22px;flex:none}

/* ================================================================
   虚拟键盘本体：样式与内容在四方案下完全一致，变的只有「落在哪」
   ================================================================ */
#kb{
  display:none;z-index:30;
  background:var(--bg-surface);border:1px solid var(--border-strong);
  padding:12px;flex-direction:column;gap:10px;overflow:hidden;
}
#kb.show{display:flex}
.kb-hd{flex:none;display:flex;align-items:center;gap:10px}
.kb-val{
  flex:1;min-width:0;height:44px;border-radius:10px;background:var(--bg-surface-2);
  border:1px solid var(--border);display:flex;align-items:center;padding-inline:14px;
  font-size:18px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.kb-val .ph{color:var(--text-3);font-weight:400}
.kb-x{width:44px;height:44px;border-radius:10px;background:var(--bg-elev);border:1px solid var(--border);font-size:18px;color:var(--text-2);flex:none}
.kb-tab{flex:none;display:flex;gap:6px;align-items:center}
.kb-tab button{height:40px;padding:0 14px;border-radius:9px;background:var(--bg-elev);border:1px solid var(--border);font-size:14px;font-weight:700;color:var(--text-2)}
.kb-tab button.on{background:rgba(26,109,255,.14);border-color:var(--brand);color:var(--brand-ink)}
.kb-hit{
  flex:none;min-height:44px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:6px 4px;border-top:1px dashed var(--border);
}
.kb-hit b{font-size:14px;color:var(--text-2);font-weight:600}
.kb-hit button{
  height:38px;padding:0 12px;border-radius:9px;background:rgba(26,109,255,.12);
  border:1px solid var(--brand);color:var(--brand-ink);font-size:14px;font-weight:700;
}
.kb-hit .none{font-size:14px;color:var(--text-3)}
.kb-keys{
  flex:1;min-height:0;display:grid;gap:8px;
  /* 键区跟着面板限宽居中：10 列的字母页铺满才够宽，4 列的数字页若也铺满，
     单个数字键会被拉到 300px 以上，比例失衡。统一限宽，两页切换也不跳宽度。 */
  width:min(100%,clamp(560px,54vw,940px));margin-inline:auto;
}
.kb-k{
  min-height:0;border-radius:10px;background:var(--bg-surface-2);border:1px solid var(--border);
  font-size:22px;font-weight:700;color:var(--text);
}
.kb-k:active{background:var(--bg-elev);transform:scale(.97)}
.kb-k.fn{font-size:17px;color:var(--text-2);background:var(--bg-elev)}
.kb-k.go{background:var(--brand);border-color:var(--brand);color:#fff;font-size:17px}
/* 数字页 4×3：比 3×4 少一行，同样的面板高度能换出更高的键 */
#pageNum{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr))}
/* 字母页 10×4 */
#pageAbc{grid-template-columns:repeat(10,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr))}
#pageAbc.hide{display:none}
#pageNum.hide{display:none}
/* 矮屏（1366×768 及竖向壁挂）：收紧自身留白，保住键高 ≥48px 这条硬线 */
@media (max-height:860px){
  #kb{padding:8px;gap:6px}
  .kb-val{height:38px;font-size:16px}
  .kb-x{width:38px;height:38px}
  .kb-tab button{height:34px;padding:0 10px;font-size:13px}
  .kb-hit{min-height:34px;padding:4px 2px}
  .kb-hit button{height:32px;font-size:13px}
  .kb-keys{gap:6px}
}

/* ============ 方案 A：底部抽屉（贴底、居中限宽、盖住分页条） ============ */
.mode-a #kb{
  position:absolute;left:0;right:0;bottom:0;
  height:clamp(280px,38vh,400px);
  border-inline:0;border-bottom:0;border-radius:18px 18px 0 0;
  box-shadow:0 -10px 30px rgba(10,20,40,.18);
}
.mode-a #kb > *{width:min(100%,clamp(560px,62vw,1060px));margin-inline:auto}

/* ============ 方案 B：顶部下拉（贴着搜索框，右对齐同宽） ============ */
.mode-b #kb{
  position:absolute;top:calc(var(--top-h) + 6px);inset-inline-end:var(--pad);
  width:min(46vw,560px);height:clamp(280px,38vh,404px);
  border-radius:18px;box-shadow:0 10px 30px rgba(10,20,40,.18);
}

/* ============ 方案 C：挤压重排（占一行，内容区被压矮） ============ */
.mode-c #kb{
  position:static;height:clamp(268px,34vh,360px);
  border-inline:0;border-bottom:0;border-radius:0;
}

/* ============ 方案 D：右侧停靠（停在右缘，内容区横向被压） ============ */
.mode-d #kb{
  position:absolute;top:var(--top-h);bottom:var(--pager-h);inset-inline-end:0;
  width:clamp(300px,34vw,540px);border-block:0;border-inline-end:0;border-radius:0;
  box-shadow:-10px 0 30px rgba(10,20,40,.14);
}
/* D 方案：键盘占的这条是「内容区右侧」，Demo 里用 grid 让出这一列，便于看真实效果 */
.mode-d.kb-open .body{padding-inline-end:calc(clamp(300px,34vw,540px) + 8px)}
</style>
</head>
<body data-page="num">

<div class="ctl">
  <b>位置方案</b>
  <button data-mode="a" class="on">A 底部抽屉</button>
  <button data-mode="b">B 顶部下拉</button>
  <button data-mode="c">C 挤压重排</button>
  <button data-mode="d">D 右侧停靠</button>
  <span class="sep"></span>
  <b>键盘页</b>
  <button data-page="num" class="on">数字 · 桌号/单号</button>
  <button data-page="abc">字母 · 菜名拼音</button>
  <span class="sep"></span>
  <button id="themeBtn">夜航 / 晨光</button>
  <span class="sep"></span>
  <span class="note">点搜索框右侧 ⌨ 开合 · Esc 也可关 · 试着搜 12 / gb / szy</span>
</div>

<div id="shell">
<div id="app" class="mode-a">

  <header class="top">
    <div class="brand"><b>切配屏 1</b><span>热菜切配 · 档口视图</span></div>
    <div class="vsep"></div>
    <div class="tabs">
      <button class="on">桌台</button><button>合菜</button><button>单菜</button><button>综合</button>
    </div>
    <div class="chips">
      <div class="chip on">全部 <b>18</b></div>
      <div class="chip">催菜 <b>2</b></div>
      <div class="chip">超时 <b>1</b></div>
    </div>
    <div class="top-sp"></div>
    <div class="search" id="search">
      <span class="ico">⌕</span>
      <input id="q" readonly placeholder="搜索菜名 / 桌号 / 订单号">
      <button id="kbBtn" title="触摸键盘（点一下开关）">⌨</button>
    </div>
    <div class="who"><div class="av">张</div><div>张师傅</div></div>
    <button class="tb-btn">换人</button>
    <div class="vsep"></div>
    <div class="clock">17:58<small>营业日 10</small></div>
  </header>

  <main class="body"><div class="grid" id="grid"></div></main>

  <div id="kb">
    <div class="kb-hd">
      <div class="kb-val" id="kbVal"><span class="ph">搜索菜名 / 桌号 / 订单号</span></div>
      <div class="kb-tab">
        <button data-page="num" class="on">数字</button>
        <button data-page="abc">字母</button>
      </div>
      <button class="kb-x" id="kbX" title="收起">⌄</button>
    </div>
    <div class="kb-hit" id="kbHit"></div>
    <div class="kb-keys" id="pageNum"></div>
    <div class="kb-keys hide" id="pageAbc"></div>
  </div>

  <footer class="pager">
    <button class="pg-btn">◀ 上一页</button>
    <div class="pg-mid"><span>第 1 / 3 页</span><span>共 18 桌</span></div>
    <button class="pg-btn">下一页 ▶</button>
    <div id="fab">⚙</div>
  </footer>

</div>
</div>

<script>
/* ---------- 假数据：桌号 + 菜品 + 拼音首字母（搜菜名时用） ---------- */
const DATA = [
  {no:'A12', cnt:4, wait:'08:12', dishes:[['宫保鸡丁','gbjd'],['蒜蓉西兰花','srxlh'],['米饭','mifan']]},
  {no:'B03', cnt:3, wait:'06:40', dishes:[['水煮鱼','szy'],['干锅牛蛙','ggnw'],['米饭','mifan']]},
  {no:'C07', cnt:2, wait:'12:05', dishes:[['番茄炒蛋','fqcd'],['紫菜汤','zct']]},
  {no:'A05', cnt:5, wait:'03:21', dishes:[['红烧肉','hsr'],['清炒时蔬','qcss'],['米饭','mifan']]},
  {no:'B11', cnt:2, wait:'09:58', dishes:[['辣子鸡','lzj'],['拍黄瓜','phg']]},
  {no:'C02', cnt:3, wait:'05:07', dishes:[['糖醋里脊','tclj'],['冬瓜汤','dgt'],['米饭','mifan']]}
];

const grid = document.getElementById('grid');
DATA.forEach(d=>{
  const c = document.createElement('div');
  c.className='tcard'; c.dataset.no=d.no;
  c.innerHTML = `<div class="chd"><span class="ctno">${d.no}</span><span class="ccnt">${d.cnt} 菜</span></div>`+
    `<div class="cbd">`+ d.dishes.slice(0,3).map(x=>
      `<div class="drow">${x[0]}<em>${x[1]}</em></div>`).join('') +`</div>`;
  grid.appendChild(c);
});

/* ---------- 键盘 ---------- */
const NUM = ['1','2','3','4','5','6','7','8','9','0',{k:'clr',t:'清空'},{k:'del',t:'⌫'}];
const ABC_ROWS = [
  'QWERTYUIOP'.split(''),
  [...'ASDFGHJKL'.split(''), {k:'del',t:'⌫'}],
  [{k:'clr',t:'清空'}, ...'ZXCVBNM'.split(''), {k:'num',t:'数字'}]
];
const pNum = document.getElementById('pageNum');
const pAbc = document.getElementById('pageAbc');
NUM.forEach(x=>{
  const b=document.createElement('button');
  const k = typeof x==='string'? x : x.k, t = typeof x==='string'? x : x.t;
  b.className='kb-k'+(k.length>1?' fn':''); b.dataset.k=k; b.textContent=t;
  pNum.appendChild(b);
});
ABC_ROWS.forEach(row=>{
  row.forEach(x=>{
    const b=document.createElement('button');
    const k = typeof x==='string'? x : x.k, t = typeof x==='string'? x : x.t;
    b.className='kb-k'+(k.length>1?' fn':''); b.dataset.k=k; b.textContent=t;
    pAbc.appendChild(b);
  });
});
/* 末行两个宽功能键：空格给菜名里的分隔，「确认搜索」是一次性收尾动作。
   两键按 6:4 分，正好凑满 10 列，不留半格空洞。 */
const sp = document.createElement('button');
sp.className='kb-k fn'; sp.dataset.k='sp'; sp.textContent='空格'; sp.style.gridColumn='span 6';
const go = document.createElement('button');
go.className='kb-k go'; go.dataset.k='ok'; go.textContent='确认搜索'; go.style.gridColumn='span 4';
pAbc.append(sp, go);

/* ---------- 状态 ---------- */
const S = { mode:'a', page:'num', open:false, q:'' };
const app=document.getElementById('app'), search=document.getElementById('search'),
      kbBtn=document.getElementById('kbBtn'), kb=document.getElementById('kb'),
      input=document.getElementById('q'), kbVal=document.getElementById('kbVal'),
      kbHit=document.getElementById('kbHit');

function paint(){
  /* 搜索框 / 抽屉里的两份「当前输入」始终同步：
     顶栏那份给远处的人看，抽屉这份给正在打字的人看，不能两边不一致。 */
  input.value = S.q;
  kbVal.innerHTML = S.q ? S.q : '<span class="ph">搜索菜名 / 桌号 / 订单号</span>';

  const q = S.q.trim().toLowerCase();
  const hitT = [], hitD = [];
  if(q){
    DATA.forEach(d=>{
      if(d.no.toLowerCase().includes(q)) hitT.push(d.no);
      d.dishes.forEach(x=>{
        if(x[0].includes(q) || x[1].startsWith(q)) hitD.push(x[0]);
      });
    });
  }
  hitD.forEach((v,i,a)=>{ if(a.indexOf(v)!==i) a.splice(i,1); });

  kbHit.innerHTML='';
  if(!q){ kbHit.innerHTML='<span class="none">输入后这里显示命中</span>'; }
  else{
    kbHit.innerHTML = `<b>命中 ${hitT.length} 桌 · ${hitD.length} 菜</b>` +
      hitT.map(n=>`<button data-t="${n}">${n} 桌</button>`).join('') +
      hitD.slice(0,4).map(n=>`<button data-d="${n}">${n}</button>`).join('');
  }
  kbHit.querySelectorAll('button').forEach(b=>{
    b.onclick = ()=>{
      const t = b.dataset.t, d = b.dataset.d;
      document.querySelectorAll('.tcard').forEach(c=>{
        let ok=false;
        if(t) ok = c.dataset.no===t;
        if(d) ok = [...c.querySelectorAll('.drow')].some(r=>r.firstChild.textContent===d);
        c.classList.toggle('hit', ok); c.classList.toggle('dim', !ok);
      });
    };
  });

  /* 词被清空时还原全部卡片：否则上一次筛选的高亮会赖着不走 */
  if(!q) document.querySelectorAll('.tcard').forEach(c=>c.classList.remove('hit','dim'));
}

function openKB(v){
  S.open = v;
  kb.classList.toggle('show', v);
  search.classList.toggle('open', v);
  kbBtn.classList.toggle('on', v);
  app.classList.toggle('kb-open', v);
  if(v) paint();
}
kbBtn.onclick = e=>{ e.stopPropagation(); openKB(!S.open); };
document.getElementById('kbX').onclick = ()=> openKB(false);
search.addEventListener('pointerdown', e=>{ if(e.target!==kbBtn) openKB(true); });

document.querySelectorAll('.kb-k').forEach(b=>{
  b.onclick = e=>{
    e.stopPropagation();
    const k = b.dataset.k;
    if(k==='del') S.q = S.q.slice(0,-1);
    else if(k==='clr') S.q='';
    else if(k==='sp') S.q += ' ';
    else if(k==='num'){ setPage('num'); return; }
    else if(k==='ok'){ openKB(false); return; }
    else S.q += k;
    paint();
  };
});
document.querySelectorAll('.kb-tab button').forEach(b=>{ b.onclick = ()=> setPage(b.dataset.page); });

function setPage(p){
  S.page = p;
  document.body.dataset.page = p;
  pNum.classList.toggle('hide', p!=='num');
  pAbc.classList.toggle('hide', p!=='abc');
  document.querySelectorAll('.kb-tab button').forEach(b=>b.classList.toggle('on', b.dataset.page===p));
  document.querySelectorAll('.ctl button[data-page]').forEach(b=>b.classList.toggle('on', b.dataset.page===p));
}

document.querySelectorAll('.ctl button[data-mode]').forEach(b=>{
  b.onclick = ()=>{
    S.mode = b.dataset.mode;
    app.className = 'mode-'+S.mode + (S.open?' kb-open':'');
    document.querySelectorAll('.ctl button[data-mode]').forEach(x=>x.classList.toggle('on', x===b));
  };
});
document.querySelectorAll('.ctl button[data-page]').forEach(b=>{ b.onclick = ()=> setPage(b.dataset.page); });
document.getElementById('themeBtn').onclick = ()=>{
  document.documentElement.dataset.theme = document.documentElement.dataset.theme==='b' ? 'a' : 'b';
};
document.addEventListener('keydown', e=>{ if(e.key==='Escape') openKB(false); });
/* 触控设备 / 真实场景：点第三 fi 内容区任何卡片都收起键盘（台账不被长期压住） */
document.getElementById('grid').addEventListener('pointerdown', ()=>{ if(S.open) openKB(false); });

/* ---------- 深链 + 探针 ---------- */
(function boot(){
  const u = new URLSearchParams(location.search);
  if(u.get('mode')) document.querySelector(`.ctl button[data-mode="${u.get('mode')}"]`).click();
  if(u.get('theme')) document.documentElement.dataset.theme = u.get('theme');
  if(u.get('page')) setPage(u.get('page'));
  if(u.get('kb')==='1') openKB(true);
  if(u.get('q')){ S.q = u.get('q'); paint(); }

  /* 顶栏真实高度写回 CSS 变量，供 B / D 方案定位 */
  const sync = ()=>{
    document.documentElement.style.setProperty('--top-h',
      document.querySelector('.top').getBoundingClientRect().height + 'px');
  };
  sync(); window.addEventListener('resize', sync); setTimeout(sync,50);

  paint();

  if(u.get('probe')==='1'){
    setTimeout(()=>{
      const r = kb.getBoundingClientRect();
      const pages = S.page==='num'? pNum : pAbc;
      const k = pages.querySelector('.kb-k').getBoundingClientRect();
      const body = document.querySelector('.body').getBoundingClientRect();
      const hidden = [...document.querySelectorAll('.tcard')].filter(c=>{
        const b = c.getBoundingClientRect();
        return b.bottom > r.top && b.top < r.bottom && b.right > r.left && b.left < r.right;
      }).length;
      document.body.setAttribute('data-probe',
        `mode=${S.mode} page=${S.page} open=${S.open}` +
        ` kb=${Math.round(r.width)}x${Math.round(r.height)}@${Math.round(r.left)},${Math.round(r.top)}` +
        ` key=${Math.round(k.width)}x${Math.round(k.height)}` +
        ` body=${Math.round(body.width)}x${Math.round(body.height)}` +
        ` coveredCards=${hidden}` +
        ` cardW=${Math.round(document.querySelector('.tcard').getBoundingClientRect().width)}`);
    }, 500);
  }
})();
</script>
</body>
</html>
