<!DOCTYPE html>
<!-- ==========================================================================
     KDS 管理端原型（B-03 概览看板 / B-04 日报 / B-18 健康检查 + B-19 路由矩阵 / B-02 初始化向导）
     URL：admin.html?view=dash|report|health|wizard&theme=a|b&lang=zh|zh-TW|en|de|ru|ar
     （lang 同时接受旧写法 yue，以及 zh-Hant / zh-HK —— 都指向同一份繁體詞典）

     与作业屏 app.html 的关系：
     - 复用同一套颜色令牌（core.css 兜底 + theme-a / theme-b 覆盖），主题靠 <html data-theme> 切换；
     - 不复用作业屏的结构类（.top / .btn / .card …），管理端全部 adm- 前缀，两条线互不影响；
     - 范式不同：作业屏是触屏（行高 48–86px），管理端是桌面鼠标（控件 34px / 正文 14px）。
     ========================================================================== -->
<html lang="zh-CN" dir="ltr" data-theme="a">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KDS 管理端 · 原型</title>
<!-- 主题挂 <html>：令牌变量必须能被所有元素取到，挂在容器上会让浮层/提示条取不到变量。 -->
<link rel="stylesheet" href="css/core.css">
<link rel="stylesheet" href="css/theme-a.css">
<link rel="stylesheet" href="css/theme-b.css">
<!-- 管理端自有样式必须在主题之后：它定义 --adm-* 语义别名指向令牌，顺序反了不会报错但可读性变差 -->
<link rel="stylesheet" href="css/admin.css">
<script>
/* 首屏防闪：在样式生效前就把 data-theme / lang / dir 写到 <html> 上。
   原型里不做持久化，但避免「先浅色一帧再变深色」的跳变。 */
(function(){
  var q=new URLSearchParams(location.search);
  var th=q.get('theme'); document.documentElement.setAttribute('data-theme', (th==='b'?'b':'a'));
  var lg=q.get('lang'); if(!lg) lg='zh';
  if(/^zh-(tw|hant|hk)/i.test(lg)) lg='yue';          /* 对外接受 BCP-47，内部 key 仍是 'yue' */
  var M={zh:['zh-CN','ltr'],yue:['zh-TW','ltr'],en:['en','ltr'],de:['de','ltr'],ru:['ru','ltr'],ar:['ar','rtl']};
  var m=M[lg]||M.zh;
  document.documentElement.setAttribute('lang',m[0]);
  document.documentElement.setAttribute('dir',m[1]);
})();
</script>
</head>
<body>

<div id="adm" class="adm">
  <!-- ===================== 顶栏（固定） ===================== -->
  <header class="adm-top">
    <div class="adm-brand">
      <b id="admProd">KDS 管理端</b>
      <span id="admShop"></span>
    </div>
    <div class="adm-top-sp"></div>
    <div class="adm-cluster">
      <span class="adm-clabel" id="admLangLbl">语言</span>
      <div class="adm-seg" id="admLang" role="group" aria-label="语言"></div>
      <span class="adm-vsep"></span>
      <span class="adm-clabel" id="admThemeLbl">主题</span>
      <div class="adm-seg" id="admTheme" role="group" aria-label="主题">
        <button type="button" data-act="theme" data-v="a">A 夜航</button>
        <button type="button" data-act="theme" data-v="b">B 晨光</button>
      </div>
      <span class="adm-vsep"></span>
      <!-- 评审对照位（虚线框）：切换「鼠标范式 / 触控范式」。
           真机是触摸屏时会自动进触控，这里只是让人在任意设备上都能比两种形态。 -->
      <span class="adm-clabel" id="admInputLbl">输入</span>
      <div class="adm-seg review" id="admInput" role="group" aria-label="输入方式（评审对照位）">
        <button type="button" data-act="input" data-v="mouse">鼠标</button>
        <button type="button" data-act="input" data-v="touch">触控</button>
      </div>
      <span class="adm-vsep"></span>
      <div class="adm-clock">
        <span class="v" id="admUpdated"></span>
        <span class="ttl" id="admTtl"></span>
      </div>
      <button type="button" class="adm-iconbtn" id="admRefresh" data-act="refresh" title="刷新">⟳</button>
    </div>
  </header>

  <!-- ===================== 主体：侧栏固定 + 内容区滚动 ===================== -->
  <div class="adm-main">
    <nav class="adm-nav" id="admNav" aria-label="主导航"></nav>
    <main class="adm-content" id="admContent"></main>
  </div>
</div>

<!-- 提示条：原型里所有「点击后的反馈」都走这里，不用 alert（alert 会打断评审节奏且无法截图） -->
<div class="adm-toast" id="admToast" role="status" aria-live="polite">
  <span class="ico" aria-hidden="true">i</span><span class="tx" id="admToastTx"></span>
</div>

   1. 状态与 URL 参数

const VIEWS = ['dash','report','health','wizard'];

  view : 'dash',
  theme: 'a',
  lang : 'zh',
  range: 'd7',      /* dash 时间档：d1 今天 / d5 最近5日 / d7 最近7日 / d30 最近30日 */
  drinks: true,     /* 是否单独给酒水 TOP 子榜 —— 本屏的核心决策开关 */
  step : 1,         /* wizard 当前步 */
  engine:'sqlite',  /* 数据库引擎：sqlite | sqlsrv */
  matrix: true,     /* B-19 路由矩阵下钻面板默认展开（评审要一眼看到，不藏起来） */
  dbTest: null,     /* null=未测试 / 'ok' / 'fail' */
  /* 输入方式：mouse | touch。
     默认按真机指针类型判定 —— 管理端既是店里那台触摸一体机上的页面，也是办公室电脑上的页面，
     同一个 URL 要给两拨人各自合适的密度。屏上对照位可以手动覆盖。 */
  input: (window.matchMedia && window.matchMedia('(pointer:coarse)').matches) ? 'touch' : 'mouse'
};
(function readQuery(){
  const q = new URLSearchParams(location.search);
  if(VIEWS.indexOf(q.get('view'))>=0) S.view = q.get('view');
  if(q.get('theme')==='b' || q.get('theme')==='a') S.theme = q.get('theme');
  const _lg = q.get('lang');
  /* 对外接受 BCP-47（zh-TW / zh-Hant / zh-HK），内部 key 仍是 'yue' */
  if(_lg) S.lang = (/^zh-(tw|hant|hk)/i.test(_lg) ? 'yue' : _lg);
  if(q.get('input')==='touch' || q.get('input')==='mouse') S.input = q.get('input');

   繁体不能写裸 'zh-Hant' 或 'yue'：前者不含地区、后者只声明语种不带文字系统，
   浏览器仍可能按简体字形回退，正体字要靠明确的 zh-TW 才稳。
   注：内部 key 沿用 'yue' 只是历史包袱（旧深链 ?lang=yue 要继续能用），对外以 tag 为准。
   ========================================================================== */

  zh :{tag:'zh-CN',       dir:'ltr', len:1.00, name:'简体中文', short:'中文'},
  yue:{tag:'zh-TW',       dir:'ltr', len:1.05, name:'繁體中文', short:'繁體'},

  ar :{tag:'ar',          dir:'rtl', len:1.35, name:'العربية',  short:'AR'}
};

  if(vars) Object.keys(vars).forEach(v=>{ s = s.split('{'+v+'}').join(vars[v]); });

const pad2 = n => String(n).padStart(2,'0');

/* 本机时区：向导第 1 步显示为只读，配错会让所有时长统计整体偏移 */
function tzLabel(){
  let z=''; try{ z = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; }catch(e){}
  const off = -new Date().getTimezoneOffset();
  const sign = off>=0 ? '+' : '−';
  return (z ? z+' · ' : '') + 'UTC' + sign + pad2(Math.floor(Math.abs(off)/60)) + ':' + pad2(Math.abs(off)%60);
}

/* ==========================================================================
   6. 图表（纯手写 SVG，不引任何图表库 / CDN）
   ========================================================================== */
function lineChart(){
  const rtl = meta().dir === 'rtl';
  const W=600,H=210,L=44,R=16,T=16,B=30;
  const lo=7.0, hi=11.0, n=TREND.length;
  /* RTL 下时间轴从右往左走：阿拉伯语阅读顺序是右→左，折线反向会读成「越看越旧」 */
  const X = i => rtl ? (W-R) - i*(W-L-R)/(n-1) : L + i*(W-L-R)/(n-1);
  const Y = v => T + (hi-v)*(H-T-B)/(hi-lo);
  let s = '';
  for(let i=0;i<=3;i++){
    const v = lo + (hi-lo)*i/3, y = Y(v).toFixed(1);
    s += '<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" style="stroke:var(--border)" stroke-width="1"/>';
    s += '<text x="'+(rtl ? W-R+6 : L-6)+'" y="'+(Number(y)+4)+'" font-size="11" text-anchor="'+(rtl?'start':'end')+'" style="fill:var(--text-3)">'+v.toFixed(1)+'</text>';
  }
  /* 目标线 10 分钟：把「达标 / 不达标」画出来，比在图例里写一句更有效 */
  const yt = Y(10).toFixed(1);
  s += '<line x1="'+L+'" y1="'+yt+'" x2="'+(W-R)+'" y2="'+yt+'" style="stroke:var(--st-warn)" stroke-width="1.5" stroke-dasharray="5 4"/>';
  s += '<text x="'+(rtl ? L+2 : W-R)+'" y="'+(Number(yt)-6)+'" font-size="11" text-anchor="'+(rtl?'start':'end')+'" style="fill:var(--st-warn)">'+esc(tr('d_target'))+'</text>';
  const pts = TREND.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
  s += '<polyline points="'+pts+'" fill="none" style="stroke:var(--brand)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  TREND.forEach((v,i)=>{
    s += '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="3.2" style="fill:var(--bg-surface);stroke:var(--brand)" stroke-width="2"/>';
  });
  const today = new Date();
  for(let i=0;i<n;i+=2){
    const d = new Date(today.getTime()); d.setDate(d.getDate()-(n-1-i));
    s += '<text x="'+X(i).toFixed(1)+'" y="'+(H-10)+'" font-size="11" text-anchor="middle" style="fill:var(--text-3)">'+d.getDate()+esc(tr('d_axisDay'))+'</text>';
  }
  return '<svg class="adm-chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(tr('d_chartLine'))+'">'+s+'</svg>';
}
function barChart(){
  const rtl = meta().dir === 'rtl';
  const W=360, rowH=34, H=6*rowH+6, labW=104, valW=48;
  const tL = rtl ? valW : labW;
  const tR = rtl ? W-labW : W-valW;
  const trackW = tR - tL;
  let s = '';
  LOAD.forEach((v,i)=>{
    const ry = i*rowH + 3, cy = ry + rowH/2;
    s += '<text x="'+(rtl ? W : 0)+'" y="'+(cy+4)+'" font-size="12" text-anchor="'+(rtl?'end':'start')+'" style="fill:var(--text-2)">'+esc(tr('st'+(i+1)))+'</text>';
    s += '<rect x="'+tL+'" y="'+(cy-8)+'" width="'+trackW+'" height="16" rx="4" style="fill:var(--bg-surface-2)"/>';
    const bw = Math.max(4, trackW*v/100);
    const bx = rtl ? tR-bw : tL;
    s += '<rect x="'+bx+'" y="'+(cy-8)+'" width="'+bw+'" height="16" rx="4" style="fill:'+(v>80?'var(--st-warn)':'var(--brand)')+'"/>';
    s += '<text x="'+(rtl ? 0 : W)+'" y="'+(cy+4)+'" font-size="12" font-weight="700" text-anchor="'+(rtl?'start':'end')+'" style="fill:var(--text)">'+v+'%</text>';
  });
  return '<svg class="adm-chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(tr('d_chartBar'))+'">'+s+'</svg>';
}

    +   '<span class="note">' + esc(tr('h_mxNote')) + '</span>'
    +   '<span class="rt"><button type="button" class="adm-btn sm" data-act="mx">'
    +     esc(tr(S.matrix ? 'c_fold' : 'c_unfold')) + '</button></span></div>'
    +   mxPanel + '</section>'
    + '</div>';
}
function cnt2(arr, k){ return arr.filter(x=>x===k).length; }

/* ==========================================================================
   11. 视图四：B-02 初始化向导
   ========================================================================== */
function field(labelKey, opts){
  const o = opts || {};
  return '<div class="adm-field' + (o.full?' full':'') + '"><label for="' + o.id + '">' + esc(tr(labelKey))
    + (o.warn ? ' <span class="req">*</span>' : '') + '</label>'
    + '<input id="' + o.id + '" class="adm-inp" type="' + (o.type||'text') + '"'
    + (o.ro?' readonly':'') + ' value="' + esc(o.val||'') + '"'
    + (o.ph?' placeholder="' + esc(o.ph) + '"':'') + '>'
    + (o.warn ? '<span class="adm-warn">' + esc(tr(o.warn)) + '</span>' : '')
    + (o.hint ? '<span class="adm-hint">' + esc(o.hint) + '</span>' : '')
    + '</div>';
}
function stepBar(){
  return '<div class="adm-steps">' + [1,2,3,4,5].map(i=>{
    const st = i < S.step ? 'done' : (i === S.step ? 'cur' : '');
    return '<div class="adm-step ' + st + '"' + (i===S.step?' aria-current="step"':'') + '>'
      + '<span class="no" aria-hidden="true">' + (i < S.step ? '✓' : i) + '</span>'
      + '<span class="lb">' + esc(tr('w_s'+i)) + '</span>'
      + (i<5 ? '<span class="ln" aria-hidden="true"></span>' : '')
      + '</div>';
  }).join('') + '</div>';
}
function wizardBody(){
  if(S.step === 1){
    const langs = Object.keys(LANG_META).map(k=>{
      const m = LANG_META[k];
      return '<button type="button" class="adm-radio' + (S.lang===k?' on':'') + '" data-act="wlang" data-v="' + k + '"'
        + ' role="radio" aria-checked="' + (S.lang===k?'true':'false') + '">'
        + '<span class="dt" aria-hidden="true"></span>'
        + '<span class="tx"><b lang="' + m.tag + '">' + esc(m.name) + '</b><span>' + esc(m.tag) + '</span></span>'
        + '</button>';
    }).join('');
    return '<div class="adm-card-bd">'
      + '<div class="adm-field full"><label>' + esc(tr('w_lang')) + '</label>'
      +   '<div class="adm-radios" role="radiogroup" aria-label="' + esc(tr('w_lang')) + '">' + langs + '</div>'
      +   '<span class="adm-hint">' + esc(tr('w_langHint')) + '</span></div>'
      + '<div class="adm-field"><label for="wz-tz">' + esc(tr('w_tz')) + '</label>'
      +   '<input id="wz-tz" class="adm-inp" type="text" readonly value="' + esc(tzLabel()) + '">'
      +   '<span class="adm-hint">' + esc(tr('w_tzHint')) + '</span></div>'
      + '</div>';
  }
  if(S.step === 2){
    const biz = ['bz1','bz2','bz3','bz4'].map((k,i)=>
      '<button type="button" class="adm-radio' + (i===0?' on':'') + '" data-act="biz" data-v="' + k + '"'
      + ' role="radio" aria-checked="' + (i===0?'true':'false') + '">'
      + '<span class="dt" aria-hidden="true"></span><span class="tx"><b>' + esc(tr(k)) + '</b></span></button>').join('');
    return '<div class="adm-card-bd"><div class="adm-form">'
      + field('w_shopName', {id:'wz-nm', val:tr('c_shop')})
      /* 门店编码：创建后不可改 —— 红字警示 + 二次确认提示条，两层提示缺一不可，
         只写红字用户会习惯性忽略，只写提示条则看不出是哪一格 */
      + '<div class="adm-field"><label for="wz-cd">' + esc(tr('w_code')) + ' <span class="req">*</span></label>'
      +   '<input id="wz-cd" class="adm-inp" type="text" value="CN-SH-0342">'
      +   '<span class="adm-warn">' + esc(tr('w_codeWarn')) + '</span></div>'
      + '<div class="adm-field full"><div class="adm-notice"><span>' + esc(tr('w_codeConfirm')) + '</span></div></div>'
      + '<div class="adm-field full"><label>' + esc(tr('w_biz')) + '</label>'
      +   '<div class="adm-radios" role="radiogroup" aria-label="' + esc(tr('w_biz')) + '">' + biz + '</div>'
      +   '<span class="adm-hint">' + esc(tr('w_bizHint')) + '</span></div>'
      + field('w_addr', {id:'wz-addr', full:true, val:'上海市中山南路 342 号 1F'})
      + field('w_tel',  {id:'wz-tel',  val:'021-5432 1088'})
      + '</div></div>';
  }
  if(S.step === 3){
    const eng = [['sqlite','w_sqlite','w_sqliteNote'],['sqlsrv','w_sqlsrv','w_sqlsrvNote']].map(e=>
      '<button type="button" class="adm-radio' + (S.engine===e[0]?' on':'') + '" data-act="engine" data-v="' + e[0] + '"'
      + ' role="radio" aria-checked="' + (S.engine===e[0]?'true':'false') + '">'
      + '<span class="dt" aria-hidden="true"></span>'
      + '<span class="tx"><b>' + esc(tr(e[1])) + '</b><span>' + esc(tr(e[2])) + '</span></span></button>').join('');
    const res = S.dbTest==='ok'  ? '<div class="adm-notice info"><span>' + esc(tr('w_testOk'))  + '</span></div>'
              : S.dbTest==='fail'? '<div class="adm-notice err"><span>' + esc(tr('w_testFail')) + '</span></div>' : '';
    return '<div class="adm-card-bd">'
      + '<div class="adm-field full"><label>' + esc(tr('w_engine')) + '</label>'
      +   '<div class="adm-radios" role="radiogroup" aria-label="' + esc(tr('w_engine')) + '">' + eng + '</div></div>'
      + '<div class="adm-form">'
      +   field('w_host',  {id:'wz-host', val:'127.0.0.1'})
      +   field('w_port',  {id:'wz-port', val:'1433'})
      +   field('w_dbname',{id:'wz-db',   val:'kds_prod'})
      +   field('w_user',  {id:'wz-user', val:'kds_admin'})
      +   field('w_pwd',   {id:'wz-pwd', type:'password', val:'********'})
      + '</div>'
      + '<div style="margin-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">'
      +   '<button type="button" class="adm-btn primary" data-act="testconn">' + esc(tr('w_test')) + '</button>'
      +   (res ? '<span style="flex:1 1 260px;min-width:0">' + res + '</span>' : '')
      + '</div></div>';
  }
  if(S.step === 4){
    const segs = SEGS.map((s,i)=>
      '<div class="adm-segrow">'
      + '<button type="button" class="adm-chk' + (s.on?' on':'') + '" data-act="seg" data-i="' + i + '"'
      + ' role="checkbox" aria-checked="' + (s.on?'true':'false') + '" aria-label="' + esc(tr(s.k)) + '">✓</button>'
      + '<span class="nm">' + esc(tr(s.k)) + '</span>'
      + '<span class="tm"><input class="adm-inp" type="time" value="' + s.a + '" aria-label="' + esc(tr(s.k)) + '">'
      + '<span aria-hidden="true">–</span>'
      + '<input class="adm-inp" type="time" value="' + s.b + '" aria-label="' + esc(tr(s.k)) + '"></span>'
      + '</div>').join('');
    return '<div class="adm-card-bd">'
      + '<div class="adm-form">'
      +   field('w_dayStart', {id:'wz-day', type:'time', val:'06:00', hint:tr('w_dayHint')})
      + '</div>'
      + '<div style="margin-top:12px"><div class="adm-hint" style="margin-bottom:6px">' + esc(tr('w_seg')) + '</div>'
      + '<div class="adm-segs">' + segs + '</div>'
      + '<div class="adm-hint" style="margin-top:6px">' + esc(tr('w_segHint')) + '</div></div>'
      + '</div>';
  }
  const prog = PROG.map(p=>
    '<div class="adm-progrow"><div class="top"><span class="nm">' + esc(tr(p.k)) + '</span>'
    + (p.st==='err'
        ? '<span class="adm-b err">' + esc(tr('w_progFail')) + '</span>'
          + '<button type="button" class="adm-btn sm" data-act="retry" style="margin-inline-start:auto">'
          + esc(tr('w_retry')) + '</button>'
        : '<span class="pc">' + p.p + '%</span>')
    + '</div><div class="adm-bar ' + (p.st==='err'?'err':(p.st==='ok'?'ok':'')) + '">'
    + '<i style="width:' + p.p + '%"></i></div></div>').join('');
  return '<div class="adm-card-bd"><div class="adm-form">'
    + field('w_name',   {id:'wz-an',  val:'张伟'})
    + field('w_empno',  {id:'wz-ano', val:'E1024'})
    + field('w_mobile', {id:'wz-am',  val:'138 0013 8000'})
    + field('w_pwd',    {id:'wz-ap',  type:'password', val:'********'})
    + field('w_pwd2',   {id:'wz-ap2', type:'password', val:'********'})
    + '</div>'
    /* 三条进度条静态呈现不同进度，其中一条失败 —— 安装失败是常态，
       原型必须把「失败 / 重试」这条路径画出来，否则评审只会看到happy path */
    + '<div class="adm-prog" style="margin-top:14px">' + prog + '</div>'
    + '</div>';
}
function viewWizard(){
  const last = S.step === 5;
  return '<div class="adm-view">'
    + '<div class="adm-hd"><div class="tl"><h1>' + esc(tr('w_title')) + '</h1>'
    + '<div class="sub">' + esc(tr('w_sub')) + '</div></div>'
    + '<div class="acts"><button type="button" class="adm-btn quiet" data-act="skip">'
    +   esc(tr('w_skip')) + '</button></div></div>'
    + stepBar()
    + '<section class="adm-card"><div class="adm-card-hd"><h2>'
    +   S.step + ' / 5 · ' + esc(tr('w_s'+S.step)) + '</h2>'
    +   '<span class="note">' + esc(tr('w_sub')) + '</span></div>'
    +   wizardBody()
    +   '<div class="adm-card-bd" style="border-top:1px solid var(--adm-line)"><div class="adm-wzfoot">'
    +     (S.step>1 ? '<button type="button" class="adm-btn" data-act="step" data-v="prev">' + esc(tr('w_prev')) + '</button>' : '')
    +     '<span class="sp"></span>'
    +     (last ? '<button type="button" class="adm-btn primary" data-act="finish">' + esc(tr('w_finish')) + '</button>'
                : '<button type="button" class="adm-btn primary" data-act="step" data-v="next">' + esc(tr('w_next')) + '</button>')
    +   '</div></div></section>'
    /* 重入策略：一行小字 + 一条「上次未完成」提示条样例 */
    + '<div class="adm-notice info"><span>' + esc(tr('w_resume')) + '</span>'
    +   '<span class="ac"><button type="button" class="adm-btn sm" data-act="step" data-v="3">'
    +   esc(tr('c_go')) + '</button></span></div>'
    + '<div class="adm-footnote">' + esc(tr('w_resumeHint')) + '</div>'
    + '</div>';
}

/* ==========================================================================
   12. 渲染与交互
   ========================================================================== */
function render(){
  renderTop();
  renderNav();
  const c = $('#admContent');
  c.innerHTML = S.view==='dash'  ? viewDash()
              : S.view==='report'? viewReport()
              : S.view==='health'? viewHealth()
              : viewWizard();
  c.scrollTop = 0;
  syncURL();
}

document.addEventListener('click', function(ev){
  const b = ev.target.closest('[data-act]');
  if(!b) return;
  const a = b.dataset ? b.dataset.act : '';
  if(a === 'nav'){
    if(b.classList.contains('off')){ toast(tr('c_soon')); return; }
    S.view = b.dataset.v; render(); return;
  }
  if(a === 'lang'){
    if(!LANG_META[b.dataset.v]) return;
    S.lang = b.dataset.v;
    /* 语言切换只改 <html lang/dir>，不换 CSS 文件 —— RTL 镜像由逻辑属性承担 */
    render(); return;
  }
  if(a === 'wlang'){ S.lang = b.dataset.v; render(); return; }
  if(a === 'theme'){ S.theme = b.dataset.v; render(); return; }
  if(a === 'input'){ S.input = b.dataset.v; render(); return; }
  if(a === 'refresh'){ $('#admUpdated').textContent = tr('c_updated', {t:hhmmss()}); toast(tr('c_refresh')); return; }
  if(a === 'range'){ S.range = b.dataset.v; render(); return; }
  if(a === 'drinks'){ S.drinks = !S.drinks; render(); return; }
  if(a === 'go'){ toast(tr('c_go') + ' · ' + tr(b.dataset.k)); return; }
  if(a === 'export'){
    toast(tr('c_export') + ' · ' + (b.dataset.v === 'pdf' ? tr('h_exportPdf') : tr('h_exportCsv'))); return;
  }
  if(a === 'fix'){
    const g = b.dataset.g, i = Number(b.dataset.i), arr = hiArr(g);
    toast(tr('h_toast', {p:tr(HC[g].p), a:(arr[i] && arr[i][0]) || ''})); return;
  }
  if(a === 'mx'){ S.matrix = !S.matrix; render(); return; }
  if(a === 'testconn'){ S.dbTest = (S.dbTest === 'ok') ? 'fail' : 'ok'; render(); return; }
  if(a === 'biz' || a === 'engine'){ return; }
  if(a === 'seg'){ const i = Number(b.dataset.i); SEGS[i].on = !SEGS[i].on; render(); return; }
  if(a === 'step'){
    const v = b.dataset.v;
    if(v === 'prev') S.step = Math.max(1, S.step - 1);
    else if(v === 'next') S.step = Math.min(5, S.step + 1);
    else S.step = Math.max(1, Math.min(5, Number(v) || 1));
    render(); return;
  }
  if(a === 'skip'){ toast(tr('w_skip') + ' · ' + tr('w_s' + S.step)); return; }
  if(a === 'finish'){ toast(tr('w_done')); return; }
  if(a === 'retry'){ toast(tr('w_retry') + ' · ' + tr('w_prog3')); return; }
});

/* 数字键 1–4 切视图，方便评审快速比对四屏。
   焦点在输入框里时必须放行 —— 否则在「门店名称」里打 1 会直接跳去日报 */
document.addEventListener('keydown', function(ev){
  if(ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const t = ev.target;
  if(t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
  const i = Number(ev.key) - 1;
  if(Number.isInteger(i) && i >= 0 && i < VIEWS.length){ S.view = VIEWS[i]; render(); }
});

render();

})();
</script>
